<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MACD 金叉策略 — 双市场仪表盘</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e17; --surface: #111827; --surface2: #1a2035; --border: #1e2a3a;
    --text: #e2e8f0; --muted: #64748b; --accent: #3b82f6; --accent2: #06b6d4;
    --green: #10b981; --red: #ef4444; --yellow: #f59e0b; --purple: #8b5cf6;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.5; }
  header { border-bottom: 1px solid var(--border); padding: 0 32px; height: 64px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; background: rgba(10,14,23,0.95); backdrop-filter: blur(12px); z-index: 100; }
  .header-left { display: flex; align-items: center; gap: 16px; }
  .logo { font-size: 18px; font-weight: 700; color: var(--accent); }
  .market-toggle { display: flex; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .toggle-btn { padding: 6px 16px; font-size: 13px; font-weight: 500; cursor: pointer; border: none; background: none; color: var(--muted); transition: all 0.2s; }
  .toggle-btn.active { background: var(--accent); color: white; }
  .toggle-btn:hover:not(.active) { color: var(--text); }
  .market-label { font-size: 13px; color: var(--muted); }
  .header-right { display: flex; align-items: center; gap: 20px; font-size: 13px; color: var(--muted); }
  .update-time { color: var(--accent2); font-family: 'JetBrains Mono', monospace; }
  main { max-width: 1400px; margin: 0 auto; padding: 32px 24px; }
  .summary-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 32px; }
  .summary-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px 24px; }
  .summary-card .value { font-size: 28px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
  .summary-card .label { font-size: 13px; color: var(--muted); }
  .filter-bar { display: flex; gap: 12px; margin-bottom: 24px; align-items: center; flex-wrap: wrap; }
  .filter-bar input { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 8px 14px; color: var(--text); font-size: 14px; outline: none; width: 240px; }
  .filter-bar input:focus { border-color: var(--accent); }
  .filter-tag { background: var(--surface2); border: 1px solid var(--border); border-radius: 20px; padding: 6px 14px; font-size: 13px; cursor: pointer; transition: all 0.2s; }
  .filter-tag:hover, .filter-tag.active { background: var(--accent); border-color: var(--accent); color: white; }
  .stock-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
  .stock-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; cursor: pointer; transition: all 0.2s; }
  .stock-card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
  .stock-card[data-market="a"]:hover { border-color: var(--accent2); }
  .card-header { margin-bottom: 12px; }
  .symbol-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .symbol { font-size: 16px; font-weight: 700; color: var(--text); }
  .sector-tag { background: var(--surface2); border-radius: 4px; padding: 2px 6px; font-size: 11px; color: var(--muted); }
  .sector-tag.a-share { background: rgba(6,182,212,0.15); color: var(--accent2); }
  .company-name { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-chart { height: 80px; margin: 12px 0; }
  .card-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
  .stat { text-align: center; }
  .stat-value { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
  .stat-label { font-size: 10px; color: var(--muted); }
  .card-footer { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--muted); }
  .gc-date { color: var(--green); }
  .detail-hint { opacity: 0; transition: opacity 0.2s; }
  .stock-card:hover .detail-hint { opacity: 1; color: var(--accent); }
  .empty-state { text-align: center; padding: 80px 0; color: var(--muted); }
  /* Modal */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 200; align-items: center; justify-content: center; padding: 24px; }
  .modal-overlay.show { display: flex; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; width: 100%; max-width: 720px; max-height: 90vh; overflow-y: auto; }
  .modal-header { padding: 24px 28px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: flex-start; }
  .modal-symbol { font-size: 24px; font-weight: 700; }
  .modal-sector { color: var(--accent2); font-size: 13px; margin-top: 4px; }
  .modal-close { background: none; border: none; color: var(--muted); font-size: 24px; cursor: pointer; padding: 0; line-height: 1; }
  .modal-close:hover { color: var(--text); }
  .modal-body { padding: 24px 28px; }
  .modal-chart { height: 200px; margin-bottom: 24px; }
  .modal-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 24px; }
  .modal-stat { background: var(--surface2); border-radius: 10px; padding: 16px; text-align: center; }
  .modal-stat .value { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
  .modal-stat .label { font-size: 12px; color: var(--muted); }
  .modal-section { margin-bottom: 20px; }
  .modal-section h4 { font-size: 13px; color: var(--muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em; }
  .price-table { width: 100%; border-collapse: collapse; font-size: 13px; font-family: 'JetBrains Mono', monospace; }
  .price-table th { color: var(--muted); font-weight: 500; text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  .price-table td { padding: 5px 8px; border-bottom: 1px solid var(--border); }
  .price-table tr:last-child td { border-bottom: none; }
  .profile-desc { font-size: 13px; color: var(--text); line-height: 1.7; background: var(--surface2); border-radius: 8px; padding: 14px; margin-bottom: 10px; }
  .profile-desc a { color: var(--accent); text-decoration: none; }
  .profile-desc a:hover { text-decoration: underline; }
  .profile-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 4px; }
  .profile-item { background: var(--surface2); border-radius: 8px; padding: 10px 12px; }
  .profile-item .label { font-size: 11px; color: var(--muted); margin-bottom: 2px; }
  .profile-item .value { font-size: 13px; font-weight: 600; word-break: break-all; }
  .news-list { display: flex; flex-direction: column; gap: 8px; }
  .news-summary { font-size: 13px; color: var(--accent2); background: rgba(6,182,212,0.08); border-left: 3px solid var(--accent2); border-radius: 6px; padding: 12px 14px; line-height: 1.7; }
  .news-item { background: var(--surface2); border-radius: 8px; padding: 12px 14px; }
  .news-item .news-title { font-size: 13px; color: var(--text); line-height: 1.4; margin-bottom: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .news-item .news-title a { color: var(--text); text-decoration: none; }
  .news-item .news-title a:hover { color: var(--accent); text-decoration: underline; }
  .news-item .news-meta { font-size: 11px; color: var(--muted); }
  @media (max-width: 768px) { .summary-bar { grid-template-columns: repeat(2, 1fr); } .stock-grid { grid-template-columns: 1fr; } header { padding: 0 16px; } main { padding: 16px; } .profile-grid { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>
<header>
  <div class="header-left">
    <div class="logo">📈 MACD 金叉策略</div>
    <div class="market-toggle">
      <button class="toggle-btn active" data-market="us" onclick="switchMarket('us')">🌎 美股</button>
      <button class="toggle-btn" data-market="a" onclick="switchMarket('a')">🇨🇳 A股</button>
    </div>
    <div class="market-label" id="marketLabel">S&P 500 · 沪深300</div>
  </div>
  <div class="header-right">
    <span id="scanCount">扫描 503 只美股 + 300 只A股</span>
    <span class="update-time" id="updateTime">🕐 更新中…</span>
  </div>
</header>
<main>
  <div class="summary-bar">
    <div class="summary-card">
      <div class="value" id="summaryCount" style="color:var(--green)">0</div>
      <div class="label">金叉股票数</div>
    </div>
    <div class="summary-card">
      <div class="value" id="summaryReturn">0%</div>
      <div class="label">平均持仓收益</div>
    </div>
    <div class="summary-card">
      <div class="value" id="summaryWinners">0/0</div>
      <div class="label">盈利/总数</div>
    </div>
    <div class="summary-card">
      <div class="value" style="color:var(--accent2)">14天</div>
      <div class="label">持仓周期</div>
    </div>
  </div>
  <div class="filter-bar" id="filterBar">
    <input type="text" id="searchInput" placeholder="搜索股票代码或名称…" oninput="filterStocks()">
  </div>
  <div class="stock-grid" id="stockGrid">

  </div>
</main>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-header">
      <div>
        <div class="modal-symbol" id="modalSymbol">—</div>
        <div class="modal-sector" id="modalSector"></div>
        <div class="modal-name" id="modalName" style="color:var(--muted);font-size:13px;margin-top:2px"></div>
      </div>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="modal-chart"><canvas id="modalChart"></canvas></div>
      <div class="modal-stats">
        <div class="modal-stat">
          <div class="value" id="modalClose">—</div>
          <div class="label">当前价格</div>
        </div>
        <div class="modal-stat">
          <div class="value" id="modalDiff">—</div>
          <div class="label">DIF-SA</div>
        </div>
        <div class="modal-stat">
          <div class="value" id="modalGCDate" style="color:var(--green)">—</div>
          <div class="label">金叉日期</div>
        </div>
      </div>
      <div class="modal-section">
        <h4>📊 持仓期间价格</h4>
        <table class="price-table">
          <thead><tr><th>日期</th><th>收盘价</th><th>涨跌幅</th></tr></thead>
          <tbody id="priceTableBody"></tbody>
        </table>
      </div>
      <div class="modal-section" id="profileSection" style="display:none">
        <h4>🏢 公司概况</h4>
        <div class="profile-desc" id="profileDesc"></div>
        <div class="profile-grid" id="profileGrid"></div>
      </div>
      <div class="modal-section" id="summarySection" style="display:none">
        <h4>📌 新闻概要</h4>
        <div class="news-summary" id="newsSummary"></div>
      </div>
      <div class="modal-section" id="newsSection" style="display:none">
        <h4>📰 近期新闻</h4>
        <div class="news-list" id="newsList"></div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script>
var usStocks = [];
var aStocks = [];
var currentMarket = 'us';
var currentSector = 'all';
var currentSearch = '';
var modalChart = null;

function switchMarket(market) {
  currentMarket = market;
  document.querySelectorAll('.toggle-btn').forEach(function(b) {
    b.classList.toggle('active', b.dataset.market === market);
  });
  var label = market === 'us' ? 'S&P 500 · 沪深300' : (market === 'a' ? '沪深300' : 'S&P 500');
  document.getElementById('marketLabel').textContent = label;
  renderStocks();
  updateSummary();
}

function updateSummary() {
  var summary = currentMarket === 'us' ? {'count': 0, 'avg_return': 0, 'winners': '0/0', 'currency': '$'} : {'count': 0, 'avg_return': 0, 'winners': '0/0', 'currency': '¥'};
  document.getElementById('summaryCount').textContent = summary.count;
  var retEl = document.getElementById('summaryReturn');
  retEl.textContent = summary.avg_return + '%';
  retEl.style.color = summary.avg_return >= 0 ? 'var(--green)' : 'var(--red)';
  document.getElementById('summaryWinners').textContent = summary.winners;
}

function getSectorTags(market) {
  if (market === 'us') {
    return [
      ['全部', 'all'], ['信息技术', 'Information Technology'], ['医疗保健', 'Health Care'],
      ['金融', 'Financials'], ['工业', 'Industrials'], ['消费必需', 'Consumer Staples'],
      ['非必需消费', 'Consumer Discretionary'], ['材料', 'Materials'], ['公用事业', 'Utilities'],
      ['房地产', 'Real Estate'], ['通信服务', 'Communication Services'], ['能源', 'Energy']
    ];
  } else {
    return [
      ['全部', 'all'], ['沪深300', '沪深300']
    ];
  }
}

function rebuildFilterBar() {
  var bar = document.getElementById('filterBar');
  var input = document.getElementById('searchInput');
  bar.innerHTML = '';
  bar.appendChild(input);
  var tags = getSectorTags(currentMarket);
  tags.forEach(function(t) {
    var span = document.createElement('span');
    span.className = 'filter-tag' + (t[1] === currentSector ? ' active' : '');
    span.dataset.sector = t[1];
    span.textContent = t[0];
    span.onclick = function() { setSector(t[1]); };
    bar.appendChild(span);
  });
}

function setSector(sector) {
  currentSector = sector;
  document.querySelectorAll('.filter-tag').forEach(function(t) {
    t.classList.toggle('active', t.dataset.sector === sector);
  });
  filterStocks();
}

function filterStocks() {
  currentSearch = document.getElementById('searchInput').value.toLowerCase();
  renderStocks();
}

function renderStocks() {
  var stocks = currentMarket === 'us' ? usStocks : aStocks;
  document.querySelectorAll('.stock-card').forEach(function(card) {
    var m = card.dataset.market;
    var idx = parseInt(card.getAttribute('data-index'), 10);
    var s = m === 'us' ? usStocks[idx] : aStocks[idx - usStocks.length];
    if (!s) { card.style.display = 'none'; return; }
    var show = (m === currentMarket);
    if (show) {
      var matchSector = currentSector === 'all' || s.sector === currentSector;
      var matchSearch = !currentSearch || s.symbol.toLowerCase().includes(currentSearch) || s.name.toLowerCase().includes(currentSearch);
      card.style.display = (matchSector && matchSearch) ? '' : 'none';
    } else {
      card.style.display = 'none';
    }
  });
}

document.getElementById('stockGrid').addEventListener('click', function(e) {
  var card = e.target.closest('.stock-card');
  if (!card) return;
  var m = card.dataset.market;
  var idx = parseInt(card.getAttribute('data-index'), 10);
  var s = m === 'us' ? usStocks[idx] : aStocks[idx - usStocks.length];
  if (s) openModal(s, m);
});

function openModal(s, market) {
  var currency = market === 'us' ? '$' : '¥';
  document.getElementById('modalSymbol').textContent = s.symbol;
  document.getElementById('modalSector').textContent = s.sector || '';
  document.getElementById('modalName').textContent = s.name || '';
  document.getElementById('modalClose').textContent = currency + (s.close ? s.close.toFixed(2) : 'N/A');
  document.getElementById('modalDiff').textContent = s.diff ? s.diff.toFixed(4) : 'N/A';
  document.getElementById('modalGCDate').textContent = s.golden_cross_date || 'N/A';

  // Price table
  var tbody = document.getElementById('priceTableBody');
  var rows = '';
  var prices = s.tracking_prices || [];
  prices.forEach(function(p, i) {
    var pct = i > 0 ? (((p.close - prices[i-1].close) / prices[i-1].close) * 100).toFixed(1) : '—';
    var cls = i > 0 && p.close > prices[i-1].close ? 'var(--green)' : 'var(--red)';
    var icon = i > 0 && p.close > prices[i-1].close ? '▲' : '▼';
    rows += '<tr><td>' + p.date + '</td><td>' + currency + p.close.toFixed(2) + '</td><td style="color:' + cls + '">' + icon + ' ' + Math.abs(pct) + '%</td></tr>';
  });
  tbody.innerHTML = rows;

  // Profile
  var profileSection = document.getElementById('profileSection');
  var profile = s.profile;
  if (profile && profile.description && profile.description.indexOf('获取失败') === -1) {
    var descHtml = profile.description || '';
    if (profile.website) descHtml += ' <a href="' + profile.website + '" target="_blank" style="color:var(--accent)">官网 →</a>';
    document.getElementById('profileDesc').innerHTML = descHtml;
    var items = [
      ['市值', profile.marketCap || 'N/A'],
      ['员工人数', profile.employees || 'N/A'],
      ['行业', profile.industry || profile.sector || 'N/A'],
      ['官网', profile.website ? '<a href="' + profile.website + '" target="_blank" style="color:var(--accent);word-break:break-all">' + profile.website.replace('https://','').replace('http://','') + '</a>' : 'N/A']
    ];
    document.getElementById('profileGrid').innerHTML = items.map(function(item) {
      return '<div class="profile-item"><div class="label">' + item[0] + '</div><div class="value">' + item[1] + '</div></div>';
    }).join('');
    profileSection.style.display = '';
  } else {
    profileSection.style.display = 'none';
  }

  // News Summary (LLM-generated)
  var summarySection = document.getElementById('summarySection');
  var newsSummary = s.newsSummary;
  if (newsSummary && newsSummary.text) {
    document.getElementById('newsSummary').textContent = '💡 ' + newsSummary.text;
    summarySection.style.display = '';
  } else {
    summarySection.style.display = 'none';
  }

  // News
  var newsSection = document.getElementById('newsSection');
  var newsList = document.getElementById('newsList');
  var news = s.news || [];
  if (news.length > 0 && news[0].title && news[0].title.indexOf('失败') === -1) {
    newsList.innerHTML = news.map(function(n) {
      var titleHtml = n.url ? '<a href="' + n.url + '" target="_blank" style="color:var(--text)">' + n.title + '</a>' : n.title;
      var metaHtml = n.pubDate ? '<div class="news-meta">📅 ' + n.pubDate + '</div>' : '';
      return '<div class="news-item"><div class="news-title">' + titleHtml + '</div>' + metaHtml + '</div>';
    }).join('');
    newsSection.style.display = '';
  } else {
    newsSection.style.display = 'none';
  }

  // Chart
  var ctx = document.getElementById('modalChart').getContext('2d');
  if (modalChart) modalChart.destroy();
  var labels = prices.map(function(p) { return p.date.substring(5); });
  var closes = prices.map(function(p) { return p.close; });
  var colors = [];
  for (var i = 0; i < closes.length; i++) {
    colors.push(i === 0 ? (market === 'us' ? '#3b82f6' : '#06b6d4') : closes[i] >= closes[i-1] ? '#10b981' : '#ef4444');
  }
  modalChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: labels,
      datasets: [{
        data: closes,
        borderColor: market === 'us' ? '#3b82f6' : '#06b6d4',
        backgroundColor: market === 'us' ? 'rgba(59,130,246,0.1)' : 'rgba(6,182,212,0.1)',
        borderWidth: 2, fill: true, tension: 0.3,
        pointBackgroundColor: colors, pointRadius: 4
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#64748b', maxTicksLimit: 7 } },
        y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#64748b', callback: function(v) { return currency + v.toFixed(0); } } }
      }
    }
  });

  document.getElementById('modalOverlay').classList.add('show');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
  if (modalChart) { modalChart.destroy(); modalChart = null; }
}

document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeModal(); });

// Init
rebuildFilterBar();
updateSummary();
document.getElementById('updateTime').textContent = '🕐 美股 2026-06-20 05:02:32 · A股 2026-05-10 16:24:37';

// Render US cards initially
currentSector = 'all';
currentMarket = 'us';
renderStocks();
</script>
</body>
</html>
